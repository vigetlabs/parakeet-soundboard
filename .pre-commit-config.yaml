repos:
  - repo: local
    hooks:
      - id: api-rspec
        name: Run RSpec
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec rspec
        language: system
        pass_filenames: false
        files: ^api/

      - id: api-rubocop
        name: Run Rubocop
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec rubocop
        language: system
        pass_filenames: false
        files: ^api/.*\.rb$

      - id: api-brakeman
        name: Run Brakeman
        entry: docker compose -f docker-compose.dev.yml exec -T api bundle exec brakeman -z
        language: system
        pass_filenames: false
        files: ^api/

      - id: ui-lint
        name: Run UI linter
        entry: bash -lc 'cd ui && pnpm run lint'
        language: system
        pass_filenames: false
        files: ^ui/

      - id: ui-typecheck
        name: Run UI typecheck
        entry: bash -lc 'cd ui && pnpm run typecheck'
        language: system
        pass_filenames: false
        files: ^ui/

      - id: extension-lint
        name: Run extension linter
        entry: bash -lc 'cd extension && pnpm run lint'
        language: system
        pass_filenames: false
        files: ^extension/

      - id: extension-typecheck
        name: Run extension typecheck
        entry: bash -lc 'cd extension && pnpm run compile'
        language: system
        pass_filenames: false
        files: ^extension/
